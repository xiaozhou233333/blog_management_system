server:
  port: 10030
spring:
  application:
    name: gateway-service
  config:
    import:
      - optional:nacos:gateway-service.yml
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: "123456"
      config:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: "123456"
      
    gateway:
      # Spring Cloud Gateway 5.0.x config prefix:
      #   spring.cloud.gateway.server.webflux.routes
      # (the old spring.cloud.gateway.routes no longer works)
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/user/**
            - id: blog-service
              uri: lb://blog-service
              predicates:
                - Path=/blog/**
          globalcors:                                      # ← 在 server.webflux 下面
                add-to-simple-url-handler-mapping: true        # ← 缩进进 globalcors
                cors-configurations:                           # ← 缩进进 globalcors
                  '[/**]':
                    allowedOriginPatterns: "*"
                    allowedMethods: "*"
                    allowedHeaders: "*"
                    allowCredentials: true

# 网关鉴权配置（AuthFilter 读取）
# 白名单是精确路径匹配，逗号分隔。
# 如果希望游客不登录也能看作者信息/文章列表，把下面几行注释打开：
#   auth.whitelist: /user/login,/user/register,/user/getAuthorInfo,/blog/getList,/blog/getBlogDetail
# 注意：/user/getUserInfo 不建议放出来，它和 getAuthorInfo 不是同一个语义。
# auth:
#   whitelist: /user/login,/user/register

# # 必须与 blog-common 里 JWTUtils.secret 完全一致，否则网关永远验不过用户登录发的 token
# jwt:
#   secret: dVnsmy+SIX6pNptQdeclDSJ26EMSPEIhvZYKBTTug4k=