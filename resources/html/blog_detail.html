<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客详情 · 我的博客系统</title>

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/detail.css">
    <link rel="stylesheet" href="blog-editormd/css/editormd.css">
</head>

<body>
    <nav class="nav">
        <img src="pic/logo2.jpg" alt="logo">
        <a class="blog-title" href="blog_list.html">我的博客系统</a>
        <div class="space"></div>
        <a class="nav-span" href="blog_list.html">主页</a>
        <a class="nav-span nav-auth" href="blog_edit.html">写博客</a>
        <a class="nav-span nav-auth" href="#" onclick="logout(); return false;">注销</a>
        <a class="nav-span primary nav-guest" href="blog_login.html">登录</a>
        <a class="nav-span nav-guest" href="blog_register.html">注册</a>
    </nav>

    <div class="container">
        <aside class="left">
            <div class="card">
                <img src="pic/doge.jpg" alt="avatar">
                <h3>User Id</h3>
                <a class="github-link" href="#">GitHub 地址</a>
                <div class="row">
                    <span>文章</span>
                    <span>分类</span>
                </div>
                <div class="row">
                    <span>2</span>
                    <span>1</span>
                </div>
            </div>
        </aside>

        <main class="right">
            <div class="article-head">
                <div class="title"></div>
                <div class="date"></div>
            </div>

            <div id="detail"></div>

            <!-- 只有作者本人才显示 -->
            <div class="operating" id="operating" style="display: none;">
                <button type="button" onclick="goUpdate()">编辑</button>
                <button type="button" class="danger" onclick="deleteBlog()">删除</button>
            </div>
        </main>
    </div>

    <script src="js/jquery.min.js"></script>
    <script src="blog-editormd/lib/marked.min.js"></script>
    <script src="blog-editormd/lib/prettify.min.js"></script>
    <script src="blog-editormd/editormd.js"></script>
    <script src="js/common.js"></script>
    <script>
        var blogId = getBlogId();
        var loginUserId = getLoginUserId();

        $(function () {
            if (!blogId) {
                alert("缺少 blogId，请从列表页进入");
                location.href = "blog_list.html";
                return;
            }
            loadBlog();
        });

        function loadBlog() {
            $.ajax({
                type: "get",
                url: "/blog/getBlogDetail?blogId=" + encodeURIComponent(blogId),
                success: function (result) {
                    if (result == null || result.code != 200 || result.data == null) {
                        alert(result && result.errMsg ? result.errMsg : "博客加载失败");
                        return;
                    }
                    var blog = result.data;
                    $(".title").text(blog.title);
                    $(".date").text(blog.createTime || blog.updateTime || "");

                    if (loginUserId && String(blog.userId) === String(loginUserId)) {
                        $("#operating").show();
                    }

                    if (window.editormd) {
                        editormd.markdownToHTML("detail", {
                            markdown: blog.content == null ? "" : blog.content
                        });
                    } else {
                        $("#detail").text(blog.content);
                    }
                    loadAuthor();
                }
            });
        }

        function loadAuthor() {
            getUserInfo("/user/getAuthorInfo?blogId=" + encodeURIComponent(blogId));
        }

        function goUpdate() {
            location.href = "blog_update.html?blogId=" + encodeURIComponent(blogId);
        }

        function deleteBlog() {
            if (!confirm("确定要删除这篇博客吗？")) {
                return;
            }
            $.ajax({
                type: "post",
                url: "/blog/delete?blogId=" + encodeURIComponent(blogId),
                success: function (result) {
                    if (result != null && result.code == 200 && result.data == true) {
                        alert("删除成功，返回列表页");
                        location.href = "blog_list.html";
                    } else {
                        alert(result && result.errMsg ? result.errMsg : "删除失败");
                    }
                }
            });
        }
    </script>
</body>

</html>
