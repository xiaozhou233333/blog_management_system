<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 · 我的博客系统</title>

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <nav class="nav">
        <img src="pic/logo2.jpg" alt="logo">
        <a class="blog-title" href="blog_list.html">我的博客系统</a>
        <div class="space"></div>
        <a class="nav-span" href="blog_list.html">主页</a>
        <a class="nav-span" href="blog_login.html">登录</a>
    </nav>

    <main class="auth-wrap">
        <form class="auth-card" onsubmit="register(); return false;">
            <div class="auth-head">
                <img class="auth-logo" src="pic/logo2.jpg" alt="logo">
                <h3>创建账号</h3>
                <p>注册后即可开始记录你的技术博客</p>
            </div>

            <div class="form-group">
                <label class="form-label" for="username">用户名</label>
                <input class="form-input" type="text" id="username" name="userName"
                       placeholder="请输入用户名（最多 20 个字符）" autocomplete="username">
            </div>

            <div class="form-group">
                <label class="form-label" for="password">密码</label>
                <input class="form-input" type="password" id="password" name="password"
                       placeholder="请输入密码（最多 20 个字符）" autocomplete="new-password">
            </div>

            <div class="form-group">
                <label class="form-label" for="githubUrl">GitHub / Gitee 主页</label>
                <input class="form-input" type="text" id="githubUrl" name="githubUrl"
                       placeholder="https://github.com/yourname">
            </div>

            <div class="form-group">
                <label class="form-label" for="email">邮箱</label>
                <input class="form-input" type="text" id="email" name="email"
                       placeholder="用于接收欢迎邮件，例如 xxx@qq.com">
            </div>

            <button class="btn btn-block mt-24" type="submit">注册</button>

            <div class="auth-foot">
                已有账号？<a href="blog_login.html">返回登录</a>
            </div>
        </form>
    </main>

    <script src="js/jquery.min.js"></script>
    <script src="js/common.js"></script>
    <script>
        function register() {
            var payload = {
                "userName": $("#username").val(),
                "password": $("#password").val(),
                "githubUrl": $("#githubUrl").val(),
                "email": $("#email").val()
            };
            $.ajax({
                type: "post",
                url: "/user/register",
                contentType: "application/json",
                data: JSON.stringify(payload),
                success: function (result) {
                    if (result != null && result.code == 200) {
                        alert("注册成功，请登录");
                        // 原来跳的是不存在的 blog_register_success.html，改成登录页
                        location.assign("blog_login.html");
                    } else {
                        alert(result && result.errMsg ? result.errMsg : "注册失败");
                    }
                },
                error: function (xhr) {
                    if (xhr.status == 401) {
                        alert("注册接口被网关拦截了（401），请检查网关白名单是否包含 /user/register");
                    } else {
                        alert("注册请求失败，HTTP " + xhr.status);
                    }
                }
            });
        }
    </script>
</body>

</html>
